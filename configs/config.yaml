project:
  name: energy_profiling_thesis
  version: "2.0"
  python_version: "3.11"

# Note (2026-08-10): a `paths:` and `bore:` section used to live here. Both were
# confirmed dead — grepped the whole codebase, nothing ever reads config['paths']
# or config['bore']; real_anchor_finder.py hardcodes its own N_PER_STRATUM/bbox/seed
# values directly instead of reading this file. Removed rather than left stale.
# Strata count/plan lives in docs/10000_coordinate_breakdown.html (16 strata as of
# 2026-08-10, not 18 — parsed by coordinate_filter.py, not hardcoded here).

rasters:
  ghsl:
    built_surface:    rasters/ghsl/built_surface/GHS_BUILT_S_E2020_GLOBE_R2023A_54009_100_V1_0.tif
    building_height:  rasters/ghsl/building_height/GHS_BUILT_H_AGBH_E2018_GLOBE_R2023A_54009_100_V1_0.tif
    population:       rasters/ghsl/population/GHS_POP_E2020_GLOBE_R2023A_54009_100_V1_0.tif
  global_solar_atlas:
    pvout: rasters/global_solar_atlas/World_PVOUT_GISdata_LTAy_AvgDailyTotals_GlobalSolarAtlas-v2_GEOTIFF/PVOUT.tif
    ghi:   rasters/global_solar_atlas/World_GHI_GISdata_LTAy_AvgDailyTotals_GlobalSolarAtlas-v2_GEOTIFF/GHI.tif
  esa_worldcover:
    s3_bucket:    "s3://esa-worldcover/v200/2021/map/"
    tile_pattern: "ESA_WorldCover_10m_2021_v200_{lat_tile}{lon_tile}_Map.tif"
    local_cache:  rasters/esa_worldcover/
  natural_earth:
    ocean: rasters/natural_earth/ne_10m_ocean.shp

# logging.log_file removed 2026-08-27 — it pointed at logs/pipeline.log, a
# RotatingFileHandler that was never process-safe across run_pipeline.py's 16
# worker processes (real FileNotFoundError race on rotation, found live in the
# 10k run) and, confirmed by grep, was never read back by any code anyway.
# logger.py is console-only now; each run's own `> logs/run_10k_*.log` shell
# redirect is the actual log.
logging:
  level: INFO

# Note: the overpass_* keys that used to live here were also dead — BORE's live
# Overpass calls (real_anchor_finder.py) use their own hardcoded mirror list
# (_OVERPASS_MIRRORS) with its own rate-limiting, not this config. PORE's OSM
# reads now also go through live Overpass (osm_overpass_extract.py), fetched
# inline per-coordinate inside `stream` rather than a separate offline stage.
# kit_model below is likewise not actually read by any code — kit_caption.py's
# DEFAULT_MODEL constant (overridable via the KIT_MODEL env var) is the real
# source of truth. Kept here descriptive-only. Groq was used until 2026-08-24
# (hit its 200,000 tokens/day account cap, ~38 days to caption 10k coordinates),
# then fully removed 2026-08-27 — this project no longer calls Groq's API at all.
api:
  kit_model: "kit.gpt-oss-120b"
  gee_project: "energy-thesis"
